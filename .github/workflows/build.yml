name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source zip
        run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build mod
        if: ${{ hashFiles('lumen-client/build.gradle') != '' }}
        working-directory: lumen-client
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('lumen-client/build.gradle') != '' }}
        with:
          name: lumen-client-jar
          path: |
            lumen-client/build/libs/*.jar
            !lumen-client/build/libs/*-sources.jar

      - name: Build desktop app
        if: ${{ hashFiles('lumen-desktop/build.gradle') != '' }}
        working-directory: lumen-desktop
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('lumen-desktop/build.gradle') != '' }}
        with:
          name: lumen-desktop-apk
          path: lumen-desktop/app/build/outputs/apk/debug/*.apk
